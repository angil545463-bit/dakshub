<script>
/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {
    apiKey: "AIzaSyBA7whtVuz10pNxlK5lIOVbEJJLBQ6G3wU",
    authDomain: "dakshub-3cd0f.firebaseapp.com",
    databaseURL: "https://dakshub-3cd0f-default-rtdb.firebaseio.com",
    projectId: "dakshub-3cd0f",
    storageBucket: "dakshub-3cd0f.firebasestorage.app",
    messagingSenderId: "203055229267",
    appId: "1:203055229267:web:647ddbd7407995019d19a6"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();
const auth = firebase.auth();

/* =========================
   VARIABLES
========================= */

let clientId = null;

let currentTicketId = null;
let currentRoomId = null;
let isSearching = false;

let matchmakingListener = null;
let claimListener = null;
let messageListener = null;

let profileListListener = null;
let presenceListListener = null;
let presenceConnectedListener = null;

let privateChatRoomId = null;
let privateChatPartnerId = null;
let privateChatMessageListener = null;

/* =========================
   ELEMENTS
========================= */

const messages = document.getElementById("messages");
const emptyState = document.getElementById("emptyState");
const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const newChatBtn = document.getElementById("newChatBtn");

const connectionState =
    document.getElementById("connectionState");

const partnerTitle =
    document.getElementById("partnerTitle");

const partnerStatus =
    document.getElementById("partnerStatus");

const chatBadge =
    document.getElementById("chatBadge");

/* =========================
   TOAST
========================= */

function showToast(text) {
    const toast = document.getElementById("toast");

    if (!toast) return;

    toast.textContent = text;
    toast.classList.add("show");

    setTimeout(function () {
        toast.classList.remove("show");
    }, 3000);
}

/* =========================
   AUTH
========================= */

newChatBtn.disabled = true;

auth.onAuthStateChanged(function(user) {

    if (!user) {
        auth.signInAnonymously()
            .catch(function(error) {
                console.error(error);

                connectionState.innerHTML =
                    '<span class="dot off"></span>AUTH ERROR';

                showToast("Connection failed.");
            });

        return;
    }

    clientId = user.uid;

    newChatBtn.disabled = false;

    connectionState.innerHTML =
        '<span class="dot"></span>READY';

    updateAccountUI(user);

    if (!user.isAnonymous) {

        startPresence(user);
        startUsersDashboard();

        db.ref("presence/" + user.uid).set({
            online: true,
            lastSeen: firebase.database.ServerValue.TIMESTAMP
        }).catch(function(error) {
            console.error("Presence error:", error);
        });

    } else {

        stopUsersDashboard();
    }
});

/* =========================
   RANDOM CHAT
========================= */

async function startNewChat() {

    if (!clientId) {
        showToast("Please wait for connection...");
        return;
    }

    if (isSearching) {
        showToast("Already searching...");
        return;
    }

    if (currentRoomId) {
        showToast("You are already in a chat.");
        return;
    }

    isSearching = true;

    newChatBtn.disabled = true;

    connectionState.innerHTML =
        '<span class="dot"></span>SEARCHING';

    partnerTitle.textContent =
        "Looking for someone...";

    partnerStatus.textContent =
        "Searching for another person...";

    chatBadge.textContent = "SEARCHING";

    clearMessages();

    messageInput.disabled = true;
    sendBtn.disabled = true;

    /* Clean old listeners */

    removeMatchmakingListeners();

    /*
     * Create our own matchmaking ticket.
     *
     * IMPORTANT:
     * No "waiting" field is used.
     */

    const ticketRef = db.ref("matchmaking").push();

    currentTicketId = ticketRef.key;

    try {

        await ticketRef.set({
            userId: clientId,
            createdAt: firebase.database.ServerValue.TIMESTAMP
        });

        /*
         * Listen for another user's claim
         * on OUR ticket.
         */

        claimListener = db.ref(
            "claims/" + currentTicketId
        ).on("value", async function(snapshot) {

            const claim = snapshot.val();

            if (!claim) return;

            if (claim.claimedBy === clientId) return;

            if (!claim.roomId) return;

            await openRandomRoom(
                claim.roomId,
                claim.claimedBy
            );
        });

        /*
         * Look for an existing ticket.
         */

        await findExistingMatch();

    } catch (error) {

        console.error("Start chat error:", error);

        isSearching = false;

        newChatBtn.disabled = false;

        connectionState.innerHTML =
            '<span class="dot off"></span>ERROR';

        showToast(
            "Could not start chat: " + error.message
        );
    }
}

/* =========================
   FIND EXISTING MATCH
========================= */

async function findExistingMatch() {

    if (!currentTicketId || !clientId) return;

    const snapshot = await db.ref("matchmaking")
        .orderByChild("createdAt")
        .limitToFirst(50)
        .once("value");

    const tickets = snapshot.val();

    if (!tickets) {
        return;
    }

    const entries = Object.entries(tickets);

    for (const entry of entries) {

        const ticketId = entry[0];
        const ticket = entry[1];

        /*
         * Ignore:
         * - our own ticket
         * - broken old data
         * - root-level "waiting"
         */

        if (ticketId === currentTicketId) continue;

        if (!ticket) continue;

        if (typeof ticket !== "object") continue;

        if (!ticket.userId) continue;

        if (!ticket.createdAt) continue;

        if (ticket.userId === clientId) continue;

        /*
         * Check whether this ticket has already
         * been claimed.
         */

        const claimSnapshot = await db.ref(
            "claims/" + ticketId
        ).once("value");

        if (claimSnapshot.exists()) {
            continue;
        }

        /*
         * Create a unique claim.
         *
         * Firebase rules allow only the first
         * successful claim.
         */

        const roomId =
            makeRoomId(clientId, ticket.userId);

        const claimRef = db.ref(
            "claims/" + ticketId
        );

        try {

            await claimRef.set({
                claimedBy: clientId,
                roomId: roomId,
                createdAt:
                    firebase.database.ServerValue.TIMESTAMP
            });

            /*
             * We successfully claimed the other user.
             */

            await createRandomRoom(
                roomId,
                clientId,
                ticket.userId
            );

            return;

        } catch (error) {

            /*
             * Someone else probably claimed it first.
             * Continue searching.
             */

            console.log(
                "Ticket already claimed:",
                ticketId
            );
        }
    }
}

/* =========================
   ROOM ID
========================= */

function makeRoomId(uid1, uid2) {

    const ids = [uid1, uid2].sort();

    return "room_" + ids[0] + "_" + ids[1];
}

/* =========================
   CREATE RANDOM ROOM
========================= */

async function createRandomRoom(
    roomId,
    user1,
    user2
) {

    const roomRef = db.ref(
        "rooms/" + roomId
    );

    const roomData = {
        users: {}
    };

    roomData.users[user1] = true;
    roomData.users[user2] = true;

    try {

        await roomRef.set(roomData);

        await openRandomRoom(
            roomId,
            user2
        );

    } catch (error) {

        console.error(
            "Room creation failed:",
            error
        );

        showToast(
            "Could not create chat room."
        );
    }
}

/* =========================
   OPEN RANDOM ROOM
========================= */

async function openRandomRoom(
    roomId,
    partnerId
) {

    if (!clientId) return;

    if (currentRoomId === roomId) return;

    currentRoomId = roomId;
    isSearching = false;

    newChatBtn.disabled = false;

    connectionState.innerHTML =
        '<span class="dot"></span>CONNECTED';

    partnerTitle.textContent =
        "Connected to someone";

    partnerStatus.textContent =
        "You can start chatting now.";

    chatBadge.textContent =
        "ONLINE";

    messageInput.disabled = false;
    sendBtn.disabled = false;

    clearMessages();

    removeMatchmakingListeners();

    /*
     * Delete our matchmaking ticket.
     */

    if (currentTicketId) {

        db.ref(
            "matchmaking/" + currentTicketId
        ).remove().catch(function(error) {
            console.log(
                "Ticket cleanup:",
                error.message
            );
        });

        currentTicketId = null;
    }

    /*
     * Listen for room messages.
     */

    if (messageListener) {

        db.ref(
            "rooms/" +
            currentRoomId +
            "/messages"
        ).off(
            "value",
            messageListener
        );
    }

    messageListener = function(snapshot) {

        renderMessages(snapshot.val());
    };

    db.ref(
        "rooms/" +
        currentRoomId +
        "/messages"
    ).on(
        "value",
        messageListener
    );

    showToast("Chat connected!");
}

/* =========================
   RENDER RANDOM MESSAGES
========================= */

function renderMessages(data) {

    messages.innerHTML = "";

    if (!data) {

        const empty = document.createElement("div");

        empty.className = "empty";

        empty.innerHTML =
            "<h3>Chat connected!</h3>" +
            "<p>Send your first message.</p>";

        messages.appendChild(empty);

        return;
    }

    const list = Object.values(data);

    list.sort(function(a, b) {
        return (a.time || 0) - (b.time || 0);
    });

    list.forEach(function(message) {

        const row =
            document.createElement("div");

        row.className =
            "message-row" +
            (message.sender === clientId
                ? " mine"
                : "");

        const bubble =
            document.createElement("div");

        bubble.className = "bubble";

        const text =
            document.createElement("div");

        text.textContent =
            message.text || "";

        bubble.appendChild(text);

        const time =
            document.createElement("div");

        time.className =
            "message-time";

        if (message.time) {

            time.textContent =
                new Date(message.time)
                    .toLocaleTimeString([], {
                        hour: "2-digit",
                        minute: "2-digit"
                    });
        }

        bubble.appendChild(time);

        row.appendChild(bubble);

        messages.appendChild(row);
    });

    messages.scrollTop =
        messages.scrollHeight;
}

/* =========================
   SEND RANDOM MESSAGE
========================= */

async function sendMessage() {

    if (!clientId || !currentRoomId) {

        showToast("No chat connected.");
        return;
    }

    const text =
        messageInput.value.trim();

    if (!text) return;

    if (text.length > 2000) {

        showToast(
            "Message is too long."
        );

        return;
    }

    const messageRef = db.ref(
        "rooms/" +
        currentRoomId +
        "/messages"
    ).push();

    try {

        await messageRef.set({
            sender: clientId,
            text: text,
            time: firebase.database.ServerValue.TIMESTAMP
        });

        messageInput.value = "";

    } catch (error) {

        console.error(
            "Message error:",
            error
        );

        showToast(
            "Message could not be sent."
        );
    }
}

/* =========================
   ENTER KEY
========================= */

messageInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            if (!sendBtn.disabled) {
                sendMessage();
            }
        }
    }
);

/* =========================
   END RANDOM CHAT
========================= */

async function leaveChat() {

    removeMatchmakingListeners();

    if (messageListener && currentRoomId) {

        db.ref(
            "rooms/" +
            currentRoomId +
            "/messages"
        ).off(
            "value",
            messageListener
        );
    }

    messageListener = null;

    if (currentTicketId) {

        await db.ref(
            "matchmaking/" +
            currentTicketId
        ).remove().catch(function(){});
    }

    currentTicketId = null;

    currentRoomId = null;

    isSearching = false;

    newChatBtn.disabled = false;

    connectionState.innerHTML =
        '<span class="dot"></span>READY';

    partnerTitle.textContent =
        "Ready to connect";

    partnerStatus.textContent =
        "Press New Chat to find someone";

    chatBadge.textContent =
        "OFFLINE";

    messageInput.disabled = true;

    sendBtn.disabled = true;

    clearMessages();

    showToast("Chat ended.");
}

/* =========================
   REMOVE MATCH LISTENERS
========================= */

function removeMatchmakingListeners() {

    if (claimListener && currentTicketId) {

        db.ref(
            "claims/" +
            currentTicketId
        ).off(
            "value",
            claimListener
        );
    }

    claimListener = null;
}

/* =========================
   CLEAR MESSAGES
========================= */

function clearMessages() {

    messages.innerHTML = "";

    const empty =
        document.createElement("div");

    empty.className = "empty";

    empty.innerHTML =
        "<h3>Ready to Meet Someone?</h3>" +
        "<p>Press New Chat to start searching.</p>";

    messages.appendChild(empty);
}

/* =========================
   PRESENCE
========================= */

function startPresence(user) {

    const connectedRef =
        db.ref(".info/connected");

    if (presenceConnectedListener) {

        connectedRef.off(
            "value",
            presenceConnectedListener
        );
    }

    presenceConnectedListener =
        function(snapshot) {

            if (snapshot.val() !== true) {
                return;
            }

            const presenceRef =
                db.ref(
                    "presence/" +
                    user.uid
                );

            presenceRef.onDisconnect()
                .set({
                    online: false,
                    lastSeen:
                        firebase.database.ServerValue.TIMESTAMP
                })
                .then(function() {

                    return presenceRef.set({
                        online: true,
                        lastSeen:
                            firebase.database.ServerValue.TIMESTAMP
                    });

                })
                .catch(function(error) {

                    console.error(
                        "Presence setup:",
                        error
                    );
                });
        };

    connectedRef.on(
        "value",
        presenceConnectedListener
    );
}

/* =========================
   USERS DASHBOARD
========================= */

function startUsersDashboard() {

    if (profileListListener) {

        db.ref("directory").off(
            "value",
            profileListListener
        );
    }

    if (presenceListListener) {

        db.ref("presence").off(
            "value",
            presenceListListener
        );
    }

    let profiles = {};
    let presence = {};

    function renderUsers() {

        const usersList =
            document.getElementById("usersList");

        if (!usersList) return;

        usersList.innerHTML = "";

        const ids =
            Object.keys(profiles);

        let onlineCount = 0;

        ids.forEach(function(uid) {

            if (presence[uid] &&
                presence[uid].online === true) {

                onlineCount++;
            }
        });

        const registeredCount =
            ids.length;

        const offlineCount =
            registeredCount -
            onlineCount;

        const registeredElement =
            document.getElementById(
                "registeredCount"
            );

        const onlineElement =
            document.getElementById(
                "onlineCount"
            );

        const offlineElement =
            document.getElementById(
                "offlineCount"
            );

        if (registeredElement)
            registeredElement.textContent =
                registeredCount;

        if (onlineElement)
            onlineElement.textContent =
                onlineCount;

        if (offlineElement)
            offlineElement.textContent =
                offlineCount;

        ids.forEach(function(uid) {

            const profile =
                profiles[uid];

            if (!profile) return;

            const online =
                presence[uid] &&
                presence[uid].online === true;

            const row =
                document.createElement("div");

            row.className =
                "user-row";

            const main =
                document.createElement("div");

            main.className =
                "user-main";

            const name =
                document.createElement("div");

            name.className =
                "user-name";

            name.textContent =
                profile.username ||
                "Dakshub User";

            main.appendChild(name);

            const status =
                document.createElement("div");

            status.className =
                "user-status";

            const dot =
                document.createElement("span");

            dot.className =
                online
                    ? "dot"
                    : "dot off";

            status.appendChild(dot);

            status.appendChild(
                document.createTextNode(
                    online
                        ? "Online"
                        : "Offline"
                )
            );

            const actions =
                document.createElement("div");

            if (online && uid !== clientId) {

                const chatButton =
                    document.createElement("button");

                chatButton.type =
                    "button";

                chatButton.textContent =
                    "💬 Chat";

                chatButton.onclick =
                    function() {
                        openPrivateChat(
                            uid,
                            profile.username ||
                            "User"
                        );
                    };

                actions.appendChild(
                    chatButton
                );
            }

            row.appendChild(main);

            const right =
                document.createElement("div");

            right.style.display =
                "flex";

            right.style.alignItems =
                "center";

            right.style.gap =
                "10px";

            right.appendChild(status);

            right.appendChild(actions);

            row.appendChild(right);

            usersList.appendChild(row);
        });

        if (ids.length === 0) {

            usersList.innerHTML =
                '<div class="dashboard-empty">' +
                "No registered users yet." +
                "</div>";
        }
    }

    profileListListener =
        function(snapshot) {

            profiles =
                snapshot.val() || {};

            renderUsers();
        };

    presenceListListener =
        function(snapshot) {

            presence =
                snapshot.val() || {};

            renderUsers();
        };

    db.ref("directory").on(
        "value",
        profileListListener
    );

    db.ref("presence").on(
        "value",
        presenceListListener
    );
}

/* =========================
   STOP DASHBOARD
========================= */

function stopUsersDashboard() {

    if (profileListListener) {

        db.ref("directory").off(
            "value",
            profileListListener
        );

        profileListListener = null;
    }

    if (presenceListListener) {

        db.ref("presence").off(
            "value",
            presenceListListener
        );

        presenceListListener = null;
    }
}

/* =========================
   PRIVATE CHAT
========================= */

function openPrivateChat(
    partnerId,
    partnerName
) {

    if (!clientId) {

        showToast(
            "Please login first."
        );

        return;
    }

    if (partnerId === clientId) {

        showToast(
            "You cannot chat with yourself."
        );

        return;
    }

    privateChatPartnerId =
        partnerId;

    privateChatRoomId =
        makeRoomId(
            clientId,
            partnerId
        );

    const panel =
        document.getElementById(
            "privateChatPanel"
        );

    const title =
        document.getElementById(
            "privateChatTitle"
        );

    if (panel)
        panel.style.display =
            "block";

    if (title)
        title.textContent =
            "Chat with " +
            partnerName;

    if (privateChatMessageListener) {

        db.ref(
            "privateRooms/" +
            privateChatRoomId +
            "/messages"
        ).off(
            "value",
            privateChatMessageListener
        );
    }

    /*
     * Create private room if needed.
     *
     * Both users become members.
     */

    const roomRef =
        db.ref(
            "privateRooms/" +
            privateChatRoomId
        );

    roomRef.once("value")
        .then(function(snapshot) {

            if (!snapshot.exists()) {

                const roomData = {
                    members: {}
                };

                roomData.members[clientId] =
                    true;

                roomData.members[partnerId] =
                    true;

                return roomRef.set(
                    roomData
                );
            }
        })
        .then(function() {

            privateChatMessageListener =
                function(snapshot) {

                    renderPrivateMessages(
                        snapshot.val()
                    );
                };

            roomRef.child("messages")
                .on(
                    "value",
                    privateChatMessageListener
                );

        })
        .catch(function(error) {

            console.error(
                "Private room error:",
                error
            );

            showToast(
                "Private chat could not open."
            );
        });
}

/* =========================
   PRIVATE MESSAGES
========================= */

function renderPrivateMessages(data) {

    const box =
        document.getElementById(
            "privateChatMessages"
        );

    if (!box) return;

    box.innerHTML = "";

    if (!data) return;

    const list =
        Object.values(data);

    list.sort(function(a, b) {
        return (a.time || 0) -
               (b.time || 0);
    });

    list.forEach(function(message) {

        const row =
            document.createElement("div");

        row.className =
            "message-row" +
            (message.sender === clientId
                ? " mine"
                : "");

        const bubble =
            document.createElement("div");

        bubble.className =
            "bubble";

        const text =
            document.createElement("div");

        text.textContent =
            message.text || "";

        bubble.appendChild(text);

        const time =
            document.createElement("div");

        time.className =
            "message-time";

        if (message.time) {

            time.textContent =
                new Date(message.time)
                    .toLocaleTimeString([], {
                        hour: "2-digit",
                        minute: "2-digit"
                    });
        }

        bubble.appendChild(time);

        row.appendChild(bubble);

        box.appendChild(row);
    });

    box.scrollTop =
        box.scrollHeight;
}

/* =========================
   SEND PRIVATE MESSAGE
========================= */

async function sendPrivateMessage() {

    if (!clientId ||
        !privateChatRoomId) {

        showToast(
            "Private chat is not open."
        );

        return;
    }

    const input =
        document.getElementById(
            "privateMessageInput"
        );

    if (!input) return;

    const text =
        input.value.trim();

    if (!text) return;

    if (text.length > 2000) {

        showToast(
            "Message is too long."
        );

        return;
    }

    const ref =
        db.ref(
            "privateRooms/" +
            privateChatRoomId +
            "/messages"
        ).push();

    try {

        await ref.set({
            sender: clientId,
            text: text,
            time:
                firebase.database.ServerValue.TIMESTAMP
        });

        input.value = "";

    } catch (error) {

        console.error(
            "Private message error:",
            error
        );

        showToast(
            "Private message could not be sent."
        );
    }
}

/* =========================
   PRIVATE ENTER KEY
========================= */

const privateInput =
    document.getElementById(
        "privateMessageInput"
    );

if (privateInput) {

    privateInput.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                event.preventDefault();

                sendPrivateMessage();
            }
        }
    );
}

/* =========================
   CLOSE PRIVATE CHAT
========================= */

function closePrivateChat() {

    if (
        privateChatMessageListener &&
        privateChatRoomId
    ) {

        db.ref(
            "privateRooms/" +
            privateChatRoomId +
            "/messages"
        ).off(
            "value",
            privateChatMessageListener
        );
    }

    privateChatMessageListener =
        null;

    privateChatRoomId =
        null;

    privateChatPartnerId =
        null;

    const panel =
        document.getElementById(
            "privateChatPanel"
        );

    if (panel)
        panel.style.display =
            "none";
}

/* =========================
   ACCOUNT UI
========================= */

function updateAccountUI(user) {

    const loggedOutPanel =
        document.getElementById(
            "loggedOutPanel"
        );

    const loggedInPanel =
        document.getElementById(
            "loggedInPanel"
        );

    if (!loggedOutPanel ||
        !loggedInPanel) {
        return;
    }

    if (user && !user.isAnonymous) {

        loggedOutPanel.style.display =
            "none";

        loggedInPanel.style.display =
            "block";

        const email =
            document.getElementById(
                "profileEmail"
            );

        const name =
            document.getElementById(
                "profileName"
            );

        if (email)
            email.textContent =
                user.email || "";

        if (name)
            name.textContent =
                "Dakshub user";

        loadProfile(user.uid);

    } else {

        loggedOutPanel.style.display =
            "block";

        loggedInPanel.style.display =
            "none";
    }
}

/* =========================
   LOAD PROFILE
========================= */

function loadProfile(uid) {

    db.ref(
        "directory/" + uid
    ).once("value")
    .then(function(snapshot) {

        const data =
            snapshot.val();

        const name =
            document.getElementById(
                "profileName"
            );

        if (name && data && data.username) {

            name.textContent =
                data.username;
        }
    });
}

/* =========================
   REGISTER
========================= */

async function registerAccount() {

    const email =
        document.getElementById(
            "accountEmail"
        ).value.trim();

    const password =
        document.getElementById(
            "accountPassword"
        ).value;

    const username =
        document.getElementById(
            "profileUsername"
        ).value.trim();

    if (!email ||
        !password ||
        !username) {

        showToast(
            "Please fill all fields."
        );

        return;
    }

    if (password.length < 6) {

        showToast(
            "Password must be 6+ characters."
        );

        return;
    }

    if (username.length < 3) {

        showToast(
            "Username must be at least 3 characters."
        );

        return;
    }

    try {

        const credential =
            await auth.createUserWithEmailAndPassword(
                email,
                password
            );

        const user =
            credential.user;

        await db.ref(
            "directory/" +
            user.uid
        ).set({
            username: username,
            createdAt:
                firebase.database.ServerValue.TIMESTAMP
        });

        await user.sendEmailVerification();

        showToast(
            "Account created. Verification email sent."
        );

    } catch (error) {

        console.error(error);

        showToast(
            error.message
        );
    }
}

/* =========================
   LOGIN
========================= */

async function loginAccount() {

    const email =
        document.getElementById(
            "accountEmail"
        ).value.trim();

    const password =
        document.getElementById(
            "accountPassword"
        ).value;

    if (!email || !password) {

        showToast(
            "Enter email and password."
        );

        return;
    }

    try {

        await auth.signInWithEmailAndPassword(
            email,
            password
        );

        showToast(
            "Logged in successfully."
        );

    } catch (error) {

        console.error(error);

        showToast(
            error.message
        );
    }
}

/* =========================
   FORGOT PASSWORD
========================= */

async function forgotPassword() {

    const email =
        document.getElementById(
            "accountEmail"
        ).value.trim();

    if (!email) {

        showToast(
            "Enter your email first."
        );

        return;
    }

    try {

        await auth.sendPasswordResetEmail(
            email
        );

        showToast(
            "Password reset email sent."
        );

    } catch (error) {

        console.error(error);

        showToast(
            error.message
        );
    }
}

/* =========================
   RESEND VERIFICATION
========================= */

async function resendVerificationEmail() {

    const user =
        auth.currentUser;

    if (!user ||
        user.isAnonymous) {
        return;
    }

    try {

        await user.sendEmailVerification();

        showToast(
            "Verification email sent."
        );

    } catch (error) {

        console.error(error);

        showToast(
            error.message
        );
    }
}

/* =========================
   LOGOUT
========================= */

async function logoutAccount() {

    if (clientId) {

        db.ref(
            "presence/" +
            clientId
        ).set({
            online: false,
            lastSeen:
                firebase.database.ServerValue.TIMESTAMP
        }).catch(function(){});
    }

    stopUsersDashboard();

    try {

        await auth.signOut();

    } catch (error) {

        console.error(error);
    }
}

/* =========================
   THEME
========================= */

function toggleTheme() {

    document.body.classList.toggle(
        "light"
    );

    const light =
        document.body.classList.contains(
            "light"
        );

    const button =
        document.getElementById(
            "themeButton"
        );

    if (button) {

        button.textContent =
            light
                ? "☾ Dark"
                : "☀ Light";
    }

    localStorage.setItem(
        "dakshub-theme",
        light ? "light" : "dark"
    );
}

if (
    localStorage.getItem(
        "dakshub-theme"
    ) === "light"
) {

    document.body.classList.add(
        "light"
    );

    const button =
        document.getElementById(
            "themeButton"
        );

    if (button)
        button.textContent =
            "☾ Dark";
}

/* =========================
   ABOUT / HOME
========================= */

function showAbout() {

    const about =
        document.getElementById(
            "about"
        );

    if (about) {

        about.style.display =
            "block";

        about.scrollIntoView({
            behavior: "smooth"
        });
    }
}

function goHome() {

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}
