<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dakshub Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #1a102b;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 90%;
      max-width: 500px;
      height: 90vh;
      max-height: 700px;
      background: #26163d;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.4);
    }

    .header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #3d2a59;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .status {
      margin-top: 8px;
      color: #aaa;
      font-size: 14px;
    }

    .messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .empty-message {
      text-align: center;
      color: #aaa;
      margin-top: 50px;
    }

    .input-area {
      display: flex;
      padding: 15px;
      gap: 10px;
      border-top: 1px solid #3d2a59;
    }

    input {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
    }

    button {
      border: none;
      padding: 14px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .send {
      background: #a855f7;
      color: white;
    }

    .controls {
      display: flex;
      gap: 10px;
      padding: 15px;
      justify-content: center;
    }

    .next {
      background: #6d28d9;
      color: white;
    }

    .leave {
      background: #444;
      color: white;
    }
  </style>
</head>

<body>

  <div class="chat-container">

    <div class="header">
      <h1>DAKSHUB</h1>
      <div class="status">🟢 Looking for someone...</div>
    </div>

    <div class="messages">
      <div class="empty-message">
        No messages yet.<br>
        Say hello when you're connected!
      </div>
    </div>

    <div class="input-area">
      <input type="text" placeholder="Type your message...">
      <button class="send">Send</button>
    </div>

    <div class="controls">
      <button class="next">Next</button>
      <button class="leave">Leave</button>
    </div>

  </div>

<script>
  const input = document.querySelector("input");
  const sendButton = document.querySelector(".send");
  const messages = document.querySelector(".messages");

  function sendMessage() {
    const text = input.value.trim();

    if (text === "") return;

    const emptyMessage = document.querySelector(".empty-message");

    if (emptyMessage) {
      emptyMessage.remove();
    }

    const message = document.createElement("div");
    message.textContent = text;

    message.style.background = "#6d28d9";
    message.style.padding = "12px";
    message.style.borderRadius = "10px";
    message.style.margin = "10px 0";
    message.style.marginLeft = "auto";
    message.style.width = "fit-content";
    message.style.maxWidth = "80%";

    messages.appendChild(message);

    input.value = "";
    input.focus();
  }

  sendButton.addEventListener("click", sendMessage);

  input.addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
      sendMessage();
    }
  });
  // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBA7whtVuz10pNxlK5lIOVbEJJLBQ6G3wU",
  authDomain: "dakshub-3cd0f.firebaseapp.com",
  projectId: "dakshub-3cd0f",
  storageBucket: "dakshub-3cd0f.firebasestorage.app",
  messagingSenderId: "203055229267",
  appId: "1:203055229267:web:647ddbd7407995019d19a6",
  measurementId: "G-CDSY4KZFHQ"
};
  (async () => {
  const { initializeApp } = await import(
    "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js"
  );

  const { getDatabase, ref, push, onChildAdded } = await import(
    "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js"
  );

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  window.chatDB = db;
  window.chatRef = ref;
  window.chatPush = push;
  window.chatOnChildAdded = onChildAdded;

  console.log("Firebase connected successfully!");
})();
</script>
  
</body>
</html>
