<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dakshub Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #1a102b;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .chat-container {
      width: 100%;
      max-width: 520px;
      background: #2a1b3d;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .header {
      padding: 20px;
      border-bottom: 1px solid #46345c;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .status {
      margin-top: 10px;
      color: #c9c1d4;
      font-size: 14px;
    }

    .chat-area {
      height: 350px;
      padding: 25px;
      color: #d7d0df;
      text-align: center;
    }

    .input-area {
      padding: 15px;
      border-top: 1px solid #46345c;
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #514463;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input::placeholder {
      color: #c4bbcc;
    }

    button {
      border: none;
      padding: 14px 20px;
      border-radius: 10px;
      background: #7447b8;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .buttons {
      padding: 0 15px 20px;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .new-chat {
      background: #5d3a91;
    }

    .about {
      text-align: center;
      padding: 18px 25px 25px;
      color: #bdb3c8;
      font-size: 14px;
      line-height: 1.5;
      border-top: 1px solid #46345c;
    }
  </style>
</head>

<body>

  <div class="chat-container">

    <div class="header">
      <h1>DAKSHUB</h1>
      <div class="status">● Looking for someone...</div>
    </div>

    <div class="chat-area" id="chatArea">
      Looking for someone...
    </div>

    <div class="input-area">
      <input
        type="text"
        id="messageInput"
        placeholder="Type your message..."
      >
      <button onclick="sendMessage()">Send</button>
    </div>

    <div class="buttons">
      <button class="new-chat" onclick="newChat()">New Chat</button>
    </div>

    <div class="about">
      Dakshub is a simple website where people can connect and chat with others.
    </div>

  </div>

  <script>
    function sendMessage() {
      const input = document.getElementById("messageInput");
      const chatArea = document.getElementById("chatArea");

      if (input.value.trim() !== "") {
        chatArea.innerHTML =
          "<p><b>You:</b> " + input.value + "</p>";

        input.value = "";
      }
    }

    function newChat() {
      document.getElementById("chatArea").innerHTML =
        "Looking for someone...";
      document.getElementById("messageInput").value = "";
    }
  </script>

</body>
</html>
